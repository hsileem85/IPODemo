kind = "web"
previewPath = "/"
title = "QNB IPO Management System"
version = "1.0.0"
id = "artifacts/qnb-ipo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26123

[services.development]
run = "pnpm --filter @workspace/qnb-ipo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qnb-ipo", "run", "build" ]
publicDir = "artifacts/qnb-ipo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26123"
BASE_PATH = "/"
